# Cloudflare Workers 部署配置
# name 必须与你「现有」的 Worker 名完全一致，否则 wrangler 会新建一个 Worker，
# 线上地址会变成新的 xxx.workers.dev，原来那个也不会被更新。
name = "floral-rice-0738"
main = "dist/worker.js"
compatibility_date = "2026-01-20"
workers_dev = true

# 如果原 Worker 绑定了 KV / D1 / R2 / 自定义域名，把对应配置一并搬过来，例如：
vars = [{ u = "d03bcdd0-a390-4eb1-9e04-60c6114455c6" }]
kv_namespaces = [{ binding = "C", id = "dd2dbda06cab4af0849421a0ddd8959c" }]
# routes = [{ pattern = "example.com/*", zone_name = "example.com" }]
